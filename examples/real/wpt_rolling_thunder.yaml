# A real, in-person tournament hand: World Poker Tour Rolling Thunder final table (five players left).
# The video is not in git. Fetch it with scripts/fetch_real_video.py (it checks the SHA-1).
# Everything below was read by eye from the video's own overlays, frame by frame (scripts/frames.py).
#
# What is certain: cards, amounts, pot and the final "WIN +1,520,000" all agree with the on-screen numbers.
# What is estimated:
#   - Times are within about 1-3 s. A bet, call or fold is the second where the chips cross the line or the
#     action label first shows. A board card is the second it first shows face up on the card camera. The
#     overlay's board, win percentages and pot figure update 1-3 s later (up to 8 s on a big bet, while the
#     dealer counts), so they were not used. The turn bet was first entered at 02:05 from the pot update; the
#     chips and the BET label are at 01:57, which is what this file now says. The flop, turn and river were
#     likewise moved 1-2 s earlier, from the overlay's update to the card itself.
#   - Seat numbers and the button are inferred (Ian is the small blind, so the button is the player just
#     before him: Andreas). The video never shows real seat numbers.
#   - The video clock may include edits, so think times are video-clock times, not stopwatch times.
# hole_cam = cards shown by the broadcast's hole-card cameras. The players could not see them, so Poker Memory
# keeps them out of every number and only mentions them afterwards as hindsight.
session:
  key: wpt-rolling-thunder-final-table
  title: WPT Rolling Thunder final table (real broadcast clip)
  consent: open_license
  stakes: {sb: 30000, bb: 60000, ante: 10000, currency: chips}
  video: wpt_rolling_thunder_fold.webm
  source:
    title: Incredibly Unbelievable Fold on the World Poker Tour
    author: World Poker Tour
    url: https://commons.wikimedia.org/wiki/File:Incredibly_Unbelievable_Fold_on_the_World_Poker_Tour.webm
    license: CC BY 3.0
    license_url: https://creativecommons.org/licenses/by/3.0/

hands:
  - index: 1
    button: 5
    seats:
      - {seat: 1, alias: Ian, stack: 5665000, note: "small blind; the player who folds"}
      - {seat: 2, alias: Joe, stack: 3630000, note: "big blind", hole_cam: QcTd}
      - {seat: 3, alias: David, stack: 1035000, note: "under the gun", hole_cam: Kh6s}
      - {seat: 4, alias: Ping, stack: 750000, note: "cutoff", hole_cam: Qs9h}
      - {seat: 5, alias: Andreas, stack: 2045000, note: "button", hole_cam: Th6c}
    hero: {seat: 1, cards: KdKs}
    dealt_at: "00:06"
    events:
      - s3 fold @00:13
      - s4 fold @00:15.5
      - s5 fold @00:20
      - s1 raise 160000 @00:40
      - s2 call @00:51
      - flop Ah5h7s @00:58
      - s1 bet 150000 @01:17
      - s2 call @01:27
      - turn Jc @01:32
      - s1 check @01:37
      - s2 bet 370000 @01:57
      - s1 call @02:23
      - river Kc @02:35
      - s1 bet 800000 @03:09
      - s2 allin @03:35
      - s1 fold @07:04
    result: {1: -1490000, 2: 1520000, 3: -10000, 4: -10000, 5: -10000}
