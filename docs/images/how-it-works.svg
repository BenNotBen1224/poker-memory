<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">How Poker Memory works</title>
<desc id="d">A broadcast video or typed hand becomes a hand record. The record is replayed by the poker rules; only legal hands are kept, with every version saved. You can then ask questions, see pot odds and a river solver estimate, study one decision without hindsight, and jump to the exact video moment.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5f7068"/></marker>
</defs>
<rect width="1200" height="520" rx="18" fill="#0f1512"/>
<g font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <text x="40" y="52" fill="#e8efe9" font-size="24" font-weight="800">How it works</text>
  <text x="40" y="80" fill="#93a39a" font-size="15">One hand moves left to right. Nothing reaches the review until the rules agree it could really have happened.</text>

  <!-- column labels -->
  <g font-size="12" font-weight="700" letter-spacing="2" fill="#5f7068">
    <text x="40" y="126">1 · IN</text><text x="300" y="126">2 · READ</text><text x="560" y="126">3 · CHECK</text><text x="860" y="126">4 · REVIEW</text>
  </g>

  <!-- inputs -->
  <rect x="40" y="144" width="220" height="112" rx="12" fill="#18211d" stroke="#2b3832"/>
  <text x="60" y="178" fill="#e8efe9" font-size="18" font-weight="700">Broadcast video</text>
  <text x="60" y="204" fill="#93a39a" font-size="14">a TV poker clip with</text>
  <text x="60" y="224" fill="#93a39a" font-size="14">on-screen graphics</text>
  <rect x="40" y="276" width="220" height="112" rx="12" fill="#18211d" stroke="#2b3832"/>
  <text x="60" y="310" fill="#e8efe9" font-size="18" font-weight="700">Typed hand</text>
  <text x="60" y="336" fill="#93a39a" font-size="14">your own game, entered</text>
  <text x="60" y="356" fill="#93a39a" font-size="14">action by action</text>

  <!-- reader -->
  <rect x="300" y="144" width="220" height="112" rx="12" fill="#18211d" stroke="#4cc38a"/>
  <text x="320" y="178" fill="#e8efe9" font-size="18" font-weight="700">Reader</text>
  <text x="320" y="204" fill="#93a39a" font-size="14">reads names, chips, cards</text>
  <text x="320" y="224" fill="#93a39a" font-size="14">and actions off the screen</text>
  <text x="320" y="244" fill="#4cc38a" font-size="13" font-weight="600">~1 s per hand · CPU only</text>
  <path d="M260 200H294" stroke="#5f7068" stroke-width="2" marker-end="url(#a)"/>

  <!-- hand record -->
  <rect x="300" y="276" width="220" height="112" rx="12" fill="#18211d" stroke="#2b3832"/>
  <text x="320" y="310" fill="#e8efe9" font-size="18" font-weight="700">Hand record</text>
  <text x="320" y="336" fill="#93a39a" font-size="14">seats, stacks, cards,</text>
  <text x="320" y="356" fill="#93a39a" font-size="14">each action + video time</text>
  <path d="M410 256V270" stroke="#5f7068" stroke-width="2" marker-end="url(#a)"/>
  <path d="M260 332H294" stroke="#5f7068" stroke-width="2" marker-end="url(#a)"/>

  <!-- rules check -->
  <rect x="560" y="196" width="260" height="192" rx="12" fill="#18211d" stroke="#6aa7f0"/>
  <text x="580" y="232" fill="#e8efe9" font-size="18" font-weight="700">Rules replay</text>
  <text x="580" y="258" fill="#93a39a" font-size="14">PokerKit plays the hand back.</text>
  <text x="580" y="278" fill="#93a39a" font-size="14">Illegal bet or wrong pot?</text>
  <text x="580" y="298" fill="#93a39a" font-size="14">It is kept, with the reason,</text>
  <text x="580" y="318" fill="#93a39a" font-size="14">but never used.</text>
  <rect x="580" y="336" width="220" height="34" rx="8" fill="#13241d"/>
  <text x="594" y="358" fill="#4cc38a" font-size="13" font-weight="600">every edit saved as a version</text>
  <path d="M520 332H554" stroke="#5f7068" stroke-width="2" marker-end="url(#a)"/>

  <!-- review outputs -->
  <g>
    <path d="M820 292C840 292 840 168 854 168" fill="none" stroke="#5f7068" stroke-width="2" marker-end="url(#a)"/>
    <path d="M820 292C840 292 840 244 854 244" fill="none" stroke="#5f7068" stroke-width="2" marker-end="url(#a)"/>
    <path d="M820 292C840 292 840 320 854 320" fill="none" stroke="#5f7068" stroke-width="2" marker-end="url(#a)"/>
    <path d="M820 292C840 292 840 396 854 396" fill="none" stroke="#5f7068" stroke-width="2" marker-end="url(#a)"/>
  </g>
  <g font-size="14">
    <rect x="860" y="140" width="300" height="56" rx="10" fill="#18211d" stroke="#2b3832"/>
    <text x="878" y="164" fill="#e8efe9" font-size="16" font-weight="700">Ask in plain English</text>
    <text x="878" y="184" fill="#93a39a">"Was my river fold reasonable?"</text>
    <rect x="860" y="216" width="300" height="56" rx="10" fill="#18211d" stroke="#2b3832"/>
    <text x="878" y="240" fill="#e8efe9" font-size="16" font-weight="700">Pot odds + river solver</text>
    <text x="878" y="260" fill="#93a39a">estimates, assumptions labelled</text>
    <rect x="860" y="292" width="300" height="56" rx="10" fill="#18211d" stroke="#2b3832"/>
    <text x="878" y="316" fill="#e8efe9" font-size="16" font-weight="700">Decision study</text>
    <text x="878" y="336" fill="#93a39a">what the player knew, not hindsight</text>
    <rect x="860" y="368" width="300" height="56" rx="10" fill="#18211d" stroke="#2b3832"/>
    <text x="878" y="392" fill="#e8efe9" font-size="16" font-weight="700">Jump to the moment</text>
    <text x="878" y="412" fill="#93a39a">every action links to its video time</text>
  </g>

  <!-- footer rule -->
  <rect x="40" y="452" width="1120" height="44" rx="10" fill="#1d1a12" stroke="#4a3f22"/>
  <circle cx="64" cy="474" r="6" fill="#f2b84b"/>
  <text x="80" y="479" fill="#e8d9b0" font-size="14">Cards the player could not see (TV hole-card cameras) stay out of every number. They only appear afterwards, marked as hindsight.</text>
</g>
</svg>
