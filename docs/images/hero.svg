<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">Poker Memory</title>
<desc id="d">Poker Memory reads a poker broadcast into a legal hand record, then helps you review the decisions that mattered. Example: Ian holds two kings on an ace-five-seven-jack-king board and faces an all-in.</desc>
<defs>
  <radialGradient id="felt" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#245a42"/><stop offset="1" stop-color="#123326"/></radialGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121a16"/><stop offset="1" stop-color="#0b100d"/></linearGradient>
  <g id="card"><rect width="46" height="64" rx="6" fill="#f4f1ea"/></g>
</defs>
<rect width="1200" height="440" rx="18" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="1199" height="439" rx="18" fill="none" stroke="#2b3832"/>

<g font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <text x="60" y="92" fill="#4cc38a" font-size="15" font-weight="700" letter-spacing="3">POKER MEMORY</text>
  <text x="60" y="150" fill="#e8efe9" font-size="50" font-weight="800">Every hand,</text>
  <text x="60" y="206" fill="#e8efe9" font-size="50" font-weight="800">remembered.</text>
  <text x="60" y="252" fill="#93a39a" font-size="19">Reads a poker video into a hand you can replay,</text>
  <text x="60" y="278" fill="#93a39a" font-size="19">question and learn from.</text>

  <g font-size="15" font-weight="600">
    <rect x="60" y="316" width="188" height="36" rx="18" fill="#18211d" stroke="#2b3832"/>
    <circle cx="80" cy="334" r="5" fill="#4cc38a"/><text x="94" y="339" fill="#e8efe9">reads a hand in ~1 s</text>
    <rect x="258" y="316" width="196" height="36" rx="18" fill="#18211d" stroke="#2b3832"/>
    <circle cx="278" cy="334" r="5" fill="#6aa7f0"/><text x="292" y="339" fill="#e8efe9">checked by the rules</text>
    <rect x="464" y="316" width="138" height="36" rx="18" fill="#18211d" stroke="#2b3832"/>
    <circle cx="484" cy="334" r="5" fill="#f2b84b"/><text x="498" y="339" fill="#e8efe9">no hindsight</text>
  </g>
  <text x="60" y="390" fill="#5f7068" font-size="13">Research MVP · runs on your own computer · no paid services</text>
</g>

<g transform="translate(650 40)" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="500" height="360" rx="16" fill="#18211d" stroke="#2b3832"/>
  <ellipse cx="250" cy="170" rx="225" ry="125" fill="url(#felt)" stroke="#3d6b55" stroke-width="3"/>
  <text x="250" y="78" text-anchor="middle" fill="#cfe3d7" font-size="14" font-weight="700">Joe · all in</text>
  <g transform="translate(204 86)">
    <rect width="40" height="54" rx="5" fill="#1d2b25" stroke="#7fa595" stroke-dasharray="4 3"/><text x="20" y="35" text-anchor="middle" fill="#b8cdc3" font-size="22" font-weight="700">?</text>
    <rect x="52" width="40" height="54" rx="5" fill="#1d2b25" stroke="#7fa595" stroke-dasharray="4 3"/><text x="72" y="35" text-anchor="middle" fill="#b8cdc3" font-size="22" font-weight="700">?</text>
  </g>
  <text x="250" y="166" text-anchor="middle" fill="#93c9ae" font-size="12" font-weight="700" letter-spacing="2">POT 5,150,000</text>
  <g transform="translate(117 176)" font-weight="800" font-size="22" text-anchor="middle">
    <use href="#card"/><text x="23" y="29" fill="#c0322d">A</text><text x="23" y="54" fill="#c0322d" font-size="18">♥</text>
    <use href="#card" x="54"/><text x="77" y="29" fill="#c0322d">5</text><text x="77" y="54" fill="#c0322d" font-size="18">♥</text>
    <use href="#card" x="108"/><text x="131" y="29" fill="#14181a">7</text><text x="131" y="54" fill="#14181a" font-size="18">♠</text>
    <use href="#card" x="162"/><text x="185" y="29" fill="#14181a">J</text><text x="185" y="54" fill="#14181a" font-size="18">♣</text>
    <use href="#card" x="216"/><text x="239" y="29" fill="#14181a">K</text><text x="239" y="54" fill="#14181a" font-size="18">♣</text>
  </g>
  <g transform="translate(200 254)" font-weight="800" font-size="22" text-anchor="middle">
    <use href="#card"/><text x="23" y="29" fill="#c0322d">K</text><text x="23" y="54" fill="#c0322d" font-size="18">♦</text>
    <use href="#card" x="54"/><text x="77" y="29" fill="#14181a">K</text><text x="77" y="54" fill="#14181a" font-size="18">♠</text>
  </g>
  <text x="250" y="338" text-anchor="middle" fill="#e8efe9" font-size="15" font-weight="700">Ian · 2,140,000 to call. Fold?</text>
</g>
</svg>
